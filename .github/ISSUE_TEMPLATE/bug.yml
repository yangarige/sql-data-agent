name: Bug report
description: Report a reproducible problem using fictional data.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private schemas, production SQL, query results, or customer information.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Fictional reproduction
      description: Provide a minimal reproduction using synthetic names and data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
