name: Feature request
description: Propose a generic, reusable improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Explain the user problem with fictional examples.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Describe the observable outcome and relevant safety boundaries.
    validations:
      required: true
